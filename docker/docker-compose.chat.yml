services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  cityjson-chat:
    image: ${CITYJSON_MCP_IMAGE:-yarroudh/cityjson-mcp:latest}
    entrypoint: ["node", "/app/src/web/server.mjs"]
    env_file:
      - path: ../.env
        required: false
    environment:
      CHAT_HOST: 0.0.0.0
      CITYJSON_MCP_INPUT: /input
      CITYJSON_MCP_WORKSPACE: /data/.cityjson-mcp-workspace
      CITYJSON_MCP_ALLOWED_ROOTS: /data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../src:/app/src:ro
      - ../web:/app/web:ro
      - ../resources:/app/resources:ro
      # Frontend modules are served by the chat host. Mount Three.js from the
      # local npm install so UI development does not require rebuilding the
      # complete backend image whenever this dependency changes.
      - ../node_modules/three:/app/node_modules/three:ro
      - cityjson-input:/input
      - cityjson-data:/data

volumes:
  cityjson-input:
  cityjson-data:
  ollama-models:
