<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DATUM — CityJSON conversations powered by MCP.">
  <title>DATUM · CityJSON conversations</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app" id="app" data-theme="dark">
    <input id="file-input" type="file" accept=".json,application/json" multiple hidden>

    <aside class="sidebar">
      <header class="brand">
        <div>
          <div class="brand-mark">DATUM</div>
          <div class="brand-sub">cityjson conversations</div>
        </div>
        <button class="icon-button theme-toggle" id="theme-toggle" type="button" title="Switch theme" aria-label="Switch theme">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3Z"/></svg>
        </button>
      </header>

      <div class="sidebar-empty" id="sidebar-empty">No models loaded yet. Import a CityJSON file to open a conversation about it.</div>
      <div class="conversation-list" id="conversation-list"></div>

      <footer class="sidebar-footer">
        <button class="stub-button primary" id="import-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3M7 8l5-5 5 5M4 15v5h16v-5"/></svg>
          Import CityJSON
        </button>
      </footer>
    </aside>

    <main class="main">
      <header class="main-header" id="main-header" hidden>
        <div class="main-title"><span class="no" id="conversation-number">#001</span><span id="conversation-title"></span></div>
        <div class="main-sub" id="model-metadata"></div>
      </header>

      <section class="empty" id="empty-state">
        <button class="dropzone" id="dropzone" type="button">
          <svg class="boxes-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="m16 3 9 5-9 5-9-5 9-5ZM7 8v10l9 5 9-5V8M16 13v10M4 20l12 7 12-7"/></svg>
          <span class="dropzone-title">Drop a CityJSON file, or click to browse</span>
          <span class="dropzone-sub">The file is streamed into the MCP input inbox and imported as an immutable dataset. Ask about specific buildings or run any connected CityJSON tool.</span>
        </button>
      </section>

      <section class="thread" id="thread" hidden aria-live="polite"></section>

      <section class="composer-wrap" id="composer-wrap" hidden>
        <div class="composer-bar">
          <div class="picker">
            <button class="picker-trigger" id="model-trigger" type="button">
              <span class="picker-dot"></span>
              <span id="model-label">Loading model…</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>
            </button>
            <div class="picker-menu" id="model-menu" hidden>
              <div class="picker-menu-header">Model configured in .env</div>
              <div class="picker-item">
                <span class="name" id="model-menu-name"></span>
                <span class="sub" id="model-menu-provider"></span>
              </div>
            </div>
          </div>

          <div class="picker">
            <button class="picker-trigger" id="tools-trigger" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12h8M9 7V4M15 7V4M9 20v-3M15 20v-3M6 7h12v10H6z"/></svg>
              CityJSON MCP
              <span class="tool-count" id="tool-count"></span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>
            </button>
            <div class="picker-menu tools-menu" id="tools-menu" hidden>
              <div class="picker-menu-header">Connected MCP tools</div>
              <div class="connector-block">
                <div class="connector-head"><span class="name">CityJSON Toolbox</span><span class="connector-status on" id="backend-status">checking</span></div>
                <div class="tool-list" id="tool-list"></div>
              </div>
            </div>
          </div>
        </div>

        <form class="composer" id="chat-form">
          <textarea id="message" rows="1" placeholder="Ask about the model, or request a tool action…" aria-label="Message"></textarea>
          <button class="send-btn" id="send-button" type="submit" disabled aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 16-8-6 16-2-6-8-2ZM12 14l8-10"/></svg>
          </button>
        </form>
      </section>
    </main>

    <div class="drag-overlay" id="drag-overlay" hidden>
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 27V9l10-5 10 5v18M3 27h26M11 27v-7h10v7M10 12h3M19 12h3M10 16h3M19 16h3"/></svg>
      release to import this model
    </div>

    <div class="import-overlay" id="import-overlay" hidden>
      <span class="spinner"></span>
      <span id="import-status">Importing CityJSON through MCP…</span>
    </div>

    <div class="error-banner" id="error-banner" hidden>
      <span id="error-message"></span>
      <button id="dismiss-error" type="button" aria-label="Dismiss error">×</button>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
